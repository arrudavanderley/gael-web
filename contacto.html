<title>Contacto — Gael</title>
<meta name="description" content="Escríbeme sobre Gael: comentarios, reseñas o preguntas. Un espacio para conectar sobre la novela de Arruda Van der Ley.">
<style>
:root{
  color-scheme:dark;
  --void:#0b0a13;
  --panel:#17131f;
  --gold:#c9a35f;
  --gold-bright:#e0c07f;
  --cream:#e9e2d0;
  --muted:#8f8272;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;background:var(--void);}
body{background:var(--void);color:var(--cream);font-family:'EB Garamond',Georgia,serif;font-size:1.125rem;line-height:1.75;overflow-x:hidden;}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--gold-bright);}
a{color:inherit;text-decoration:none;}
.thread-track{position:fixed;left:10px;top:0;bottom:0;width:2px;background:rgba(201,163,95,0.15);z-index:40;}
.thread-fill{position:absolute;top:0;left:0;width:100%;height:0%;background:linear-gradient(var(--gold-bright),var(--gold));}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:center;gap:1.8rem;flex-wrap:wrap;padding:1.2rem 7rem;opacity:0;transform:translateY(-8px);transition:opacity 0.5s ease,transform 0.5s ease,background 0.4s ease;pointer-events:none;}
nav.scrolled{opacity:1;transform:translateY(0);pointer-events:auto;background:rgba(11,10,19,0.78);backdrop-filter:blur(10px);border-bottom:1px solid rgba(201,163,95,0.15);}
nav a{font-family:'Cormorant Garamond',serif;font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);}
.lang-switch{position:fixed;top:1rem;right:1rem;z-index:101;display:flex;gap:0.5rem;background:rgba(11,10,19,0.55);backdrop-filter:blur(6px);padding:0.4rem 0.7rem;border-radius:20px;border:1px solid rgba(201,163,95,0.28);}
.lang-btn{font-family:'Cormorant Garamond',serif;font-size:0.72rem;letter-spacing:0.08em;color:var(--muted);background:none;border:none;padding:0.15rem 0.2rem;cursor:pointer;}
.lang-btn.active{color:var(--gold);border-bottom:1px solid var(--gold);}
section.content{max-width:700px;margin:0 auto;padding:4.5rem 1.5rem;scroll-margin-top:80px;background-color:var(--void);}
#contacto h1{font-size:clamp(2rem,5vw,2.8rem);margin-bottom:1.5rem;text-align:center;}
.contact-form{max-width:520px;margin:2rem auto 0;}
.form-field{margin-bottom:1.4rem;}
.form-field label{display:block;font-family:'Cormorant Garamond',Georgia,serif;color:var(--gold);font-size:0.95rem;letter-spacing:0.03em;margin-bottom:0.5rem;}
.form-field input,.form-field select,.form-field textarea{width:100%;background:var(--panel);border:1px solid rgba(201,163,95,0.35);border-radius:4px;color:var(--cream);font-family:'EB Garamond',Georgia,serif;font-size:1rem;padding:0.7rem 0.9rem;transition:border-color 0.3s ease;}
.form-field textarea{min-height:180px;resize:vertical;}
.form-honey{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
.form-submit{display:block;width:100%;padding:0.9rem 1.8rem;border:1px solid var(--gold);border-radius:4px;background:transparent;color:var(--gold-bright);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.1rem;letter-spacing:0.04em;cursor:pointer;transition:all 0.3s ease;}
.form-submit:hover{background:var(--gold);color:var(--void);}
.form-submit:disabled{opacity:0.5;cursor:not-allowed;}
.form-status{margin-top:1.2rem;text-align:center;font-size:0.95rem;padding:0.9rem;border-radius:4px;}
.form-status.success{background:rgba(201,163,95,0.12);color:var(--gold-bright);border:1px solid rgba(201,163,95,0.35);}
.form-status.error{background:rgba(180,80,80,0.1);color:#e0a0a0;border:1px solid rgba(180,80,80,0.3);}
.form-status[hidden]{display:none;}
.edicion-lead{text-align:center;}
footer{text-align:center;padding:4rem 1.5rem 3rem;color:var(--muted);font-size:0.85rem;border-top:1px solid rgba(201,163,95,0.12);margin-top:1.5rem;}
</style>
</head>
<body>
<div class="thread-track"><div class="thread-fill" id="threadFill"></div></div>
<div class="lang-switch"><button class="lang-btn active" data-lang="es">ES</button><button class="lang-btn" data-lang="en">EN</button><button class="lang-btn" data-lang="pt">PT</button></div>
<nav id="nav"><a href="index.html">&larr; Gael</a></nav>

<main id="contenido">
<section class="content" id="contacto">
  <h1 data-i18n="contact-h1">Contacto</h1>
  <p class="edicion-lead" data-i18n="contact-intro">Si Gael te ha dejado algo —una pregunta, una reseña, un pensamiento que quieras compartir— este espacio es para ti.</p>

  <form class="contact-form" id="contactForm" action="https://formsubmit.co/el/kilubi" method="POST">
    <!-- Config FormSubmit - CORREGIDO -->
    <input type="hidden" name="_subject" value="Nuevo mensaje desde arrudavanderley.com">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://arrudavanderley.com/contacto.html?enviado=1">
    <input type="hidden" name="_url" value="https://arrudavanderley.com/contacto.html">
    <!-- Honeypot correcto -->
    <input type="text" name="_honey" style="display:none">

    <div class="form-field">
      <label for="cf-name" data-i18n="contact-label-name">Nombre</label>
      <input type="text" id="cf-name" name="name" required autocomplete="name">
    </div>

    <div class="form-field">
      <label for="cf-email" data-i18n="contact-label-email">Correo electrónico</label>
      <input type="email" id="cf-email" name="email" required autocomplete="email">
    </div>

    <div class="form-field">
      <label for="cf-subject" data-i18n="contact-label-subject">Motivo</label>
      <select id="cf-subject" name="Motivo">
        <option value="Comentario" data-i18n="contact-opt-comment">Comentario</option>
        <option value="Reseña" data-i18n="contact-opt-review">Reseña</option>
        <option value="Pregunta" data-i18n="contact-opt-question">Pregunta</option>
        <option value="Otro" data-i18n="contact-opt-other">Otro</option>
      </select>
    </div>

    <div class="form-field">
      <label for="cf-message" data-i18n="contact-label-message">Mensaje</label>
      <textarea id="cf-message" name="message" required></textarea>
    </div>

    <button type="submit" class="form-submit" id="cfSubmit" data-i18n="contact-submit">Enviar mensaje</button>
    <div class="form-status" id="cfStatus" hidden></div>
  </form>
</section>
</main>

<footer>
  <p>© 2026 Arruda Van der Ley</p>
</footer>

<script>
const nav = document.getElementById('nav');
const threadFill = document.getElementById('threadFill');
function onScroll(){
  const st = window.scrollY;
  const dh = document.documentElement.scrollHeight - window.innerHeight;
  const pct = dh > 0 ? (st / dh) * 100 : 0;
  threadFill.style.height = pct + '%';
  if(st > 120){ nav.classList.add('scrolled'); } else { nav.classList.remove('scrolled'); }
}
window.addEventListener('scroll', onScroll, {passive:true});
onScroll();

const translations = {
  es: {'contact-h1':'Contacto','contact-intro':'Si Gael te ha dejado algo —una pregunta, una reseña, un pensamiento que quieras compartir— este espacio es para ti.','contact-label-name':'Nombre','contact-label-email':'Correo electrónico','contact-label-subject':'Motivo','contact-opt-comment':'Comentario','contact-opt-review':'Reseña','contact-opt-question':'Pregunta','contact-opt-other':'Otro','contact-label-message':'Mensaje','contact-submit':'Enviar mensaje','contact-success':'Gracias por escribir. Tu mensaje ha llegado — te responderé en cuanto pueda.','contact-error':'Algo no salió bien. Intenta de nuevo en un momento.','contact-sending':'Enviando...'},
  en: {'contact-h1':'Contact','contact-intro':"If Gael left something with you — a question, a review, a thought you'd like to share — this space is for you.",'contact-label-name':'Name','contact-label-email':'Email address','contact-label-subject':'Subject','contact-opt-comment':'Comment','contact-opt-review':'Review','contact-opt-question':'Question','contact-opt-other':'Other','contact-label-message':'Message','contact-submit':'Send message','contact-success':"Thank you for writing. Your message has arrived — I'll reply as soon as I can.",'contact-error':'Something went wrong. Please try again in a moment.','contact-sending':'Sending...'},
  pt: {'contact-h1':'Contato','contact-intro':'Se Gael deixou algo em você —uma pergunta, uma resenha, um pensamento que queira compartilhar— este espaço é para você.','contact-label-name':'Nome','contact-label-email':'E-mail','contact-label-subject':'Motivo','contact-opt-comment':'Comentário','contact-opt-review':'Resenha','contact-opt-question':'Pergunta','contact-opt-other':'Outro','contact-label-message':'Mensagem','contact-submit':'Enviar mensagem','contact-success':'Obrigado por escrever. Sua mensagem chegou — responderei assim que possível.','contact-error':'Algo deu errado. Tente novamente em instantes.','contact-sending':'Enviando...'}
};
function applyLanguage(lang){
  if(!translations[lang]) lang='es';
  const dict=translations[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if(dict[k]!==undefined) el.textContent=dict[k];
  });
  document.documentElement.lang=lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  try{localStorage.setItem('gael-lang',lang);}catch(e){}
}
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>applyLanguage(b.dataset.lang)));
let savedLang='es'; try{savedLang=localStorage.getItem('gael-lang')||'es';}catch(e){} applyLanguage(savedLang);

const cfStatus = document.getElementById('cfStatus');
const contactForm = document.getElementById('contactForm');
const cfSubmit = document.getElementById('cfSubmit');
const currentDict = () => translations[document.documentElement.lang] || translations.es;

if(window.location.search.includes('enviado=1')){
  cfStatus.textContent = currentDict()['contact-success'];
  cfStatus.className = 'form-status success';
  cfStatus.hidden = false;
  window.history.replaceState({}, document.title, window.location.pathname);
}

contactForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const dict = currentDict();
  cfStatus.hidden = true;
  cfSubmit.disabled = true;
  cfSubmit.textContent = dict['contact-sending'];

  try {
    const formData = new FormData(contactForm);
    const response = await fetch('https://formsubmit.co/ajax/el/kilubi', {
      method: 'POST',
      body: formData,
      headers: { 'Accept': 'application/json' }
    });

    if(response.ok){
      cfStatus.textContent = dict['contact-success'];
      cfStatus.className = 'form-status success';
      cfStatus.hidden = false;
      contactForm.reset();
    } else {
      throw new Error('Error en respuesta');
    }
  } catch(err){
    cfStatus.textContent = dict['contact-error'] + ' (' + err.message + ')';
    cfStatus.className = 'form-status error';
    cfStatus.hidden = false;
  } finally {
    cfSubmit.disabled = false;
    cfSubmit.textContent = dict['contact-submit'];
  }
});
</script>
</body>
</html>
