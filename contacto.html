<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto</title>
</head>
<body>

<h1>Contacto</h1>

<form action="https://formsubmit.co/el/kilubi" method="POST">
    <input type="text" name="nombre" placeholder="Nombre" required>
    <br><br>

    <input type="email" name="email" placeholder="Correo electrónico" required>
    <br><br>

    <textarea name="mensaje" placeholder="Mensaje" required></textarea>
    <br><br>

    <input type="hidden" name="_next" value="https://arrudavanderley.com/contacto.html">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="subject" value="Nuevo mensaje desde arrudavanderley.com">

    <button type="submit">Enviar mensaje</button>
</form>

</body>
</html>
