<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto — Gael</title>
<link rel="canonical" href="https://arrudavanderley.com/contacto.html">
<style>
:root{--void:#0b0a13;--panel:#17131f;--gold:#c9a35f;--gold-bright:#e0c07f;--cream:#e9e2d0;--muted:#8f8272;}
*{margin:0;padding:0;box-sizing:border-box;} html{scroll-behavior:smooth;background:var(--void);}
body{background:var(--void);color:var(--cream);font-family:'EB Garamond',Georgia,serif;font-size:1.125rem;line-height:1.75;}
.thread-track{position:fixed;left:10px;top:0;bottom:0;width:2px;background:rgba(201,163,95,0.15);z-index:40;}
.thread-fill{position:absolute;top:0;left:0;width:100%;height:0%;background:linear-gradient(var(--gold-bright),var(--gold));}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:center;gap:1.8rem;padding:1.2rem 7rem;opacity:0;transform:translateY(-8px);transition:.5s;pointer-events:none;}
nav.scrolled{opacity:1;transform:translateY(0);pointer-events:auto;background:rgba(11,10,19,0.78);backdrop-filter:blur(10px);border-bottom:1px solid rgba(201,163,95,0.15);}
nav a{font-family:'Cormorant Garamond',serif;font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);}
.lang-switch{position:fixed;top:1rem;right:1rem;z-index:101;display:flex;gap:0.5rem;background:rgba(11,10,19,0.55);backdrop-filter:blur(6px);padding:0.4rem 0.7rem;border-radius:20px;border:1px solid rgba(201,163,95,0.28);}
.lang-btn{font-size:0.72rem;color:var(--muted);background:none;border:none;cursor:pointer;font-family:'Cormorant Garamond',serif;}
.lang-btn.active{color:var(--gold);border-bottom:1px solid var(--gold);}
section.content{max-width:700px;margin:0 auto;padding:4.5rem 1.5rem;}
#contacto h1{font-size:clamp(2rem,5vw,2.8rem);margin-bottom:1.5rem;text-align:center;font-family:'Cormorant Garamond',serif;color:var(--gold-bright);}
.contact-form{max-width:520px;margin:2rem auto 0;}
.form-field{margin-bottom:1.4rem;}
.form-field label{display:block;font-family:'Cormorant Garamond',serif;color:var(--gold);margin-bottom:0.5rem;}
.form-field input,.form-field select,.form-field textarea{width:100%;background:var(--panel);border:1px solid rgba(201,163,95,0.35);border-radius:4px;color:var(--cream);font-family:'EB Garamond',serif;font-size:1rem;padding:0.7rem 0.9rem;}
.form-field textarea{min-height:180px;resize:vertical;}
.form-submit{width:100%;padding:0.9rem;border:1px solid var(--gold);border-radius:4px;background:transparent;color:var(--gold-bright);font-family:'Cormorant Garamond',serif;font-size:1.1rem;cursor:pointer;transition:.3s;}
.form-submit:hover{background:var(--gold);color:var(--void);}
.form-submit:disabled{opacity:0.5;}
.form-status{margin-top:1.2rem;text-align:center;padding:0.9rem;border-radius:4px;white-space:pre-line;}
.form-status.success{background:rgba(201,163,95,0.12);color:var(--gold-bright);border:1px solid rgba(201,163,95,0.35);}
.form-status.error{background:rgba(180,80,80,0.1);color:#e0a0a0;border:1px solid rgba(180,80,80,0.3);}
.form-status[hidden]{display:none;}
.edicion-lead{text-align:center;}
footer{text-align:center;padding:4rem 1.5rem 3rem;color:var(--muted);font-size:0.85rem;border-top:1px solid rgba(201,163,95,0.12);margin-top:1.5rem;}
</style>
</head>
<body>
<div class="thread-track"><div class="thread-fill" id="threadFill"></div></div>
<div class="lang-switch"><button class="lang-btn active" data-lang="es">ES</button><button class="lang-btn" data-lang="en">EN</button><button class="lang-btn" data-lang="pt">PT</button></div>
<nav id="nav"><a href="index.html">← GAEL</a></nav>
<main>
<section class="content" id="contacto">
  <h1>Contacto</h1>
  <p class="edicion-lead">Si Gael te ha dejado algo —una pregunta, una reseña, un pensamiento que quieras compartir— este espacio es para ti.</p>

  <form class="contact-form" id="contactForm" action="https://formsubmit.co/el/kilubi" method="POST">
    <!-- CONFIGURACION FORMSUBMIT - SIN _next para evitar redireccion a home -->
    <input type="hidden" name="_subject" value="Nuevo mensaje desde arrudavanderley.com">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <input type="text" name="_honey" style="display:none">

    <div class="form-field">
      <label>Nombre</label>
      <input type="text" name="name" id="cf-name" required autocomplete="name">
    </div>
    <div class="form-field">
      <label>Correo electrónico</label>
      <input type="email" name="email" id="cf-email" required autocomplete="email">
    </div>
    <div class="form-field">
      <label>Motivo</label>
      <select name="Motivo" id="cf-subject">
        <option value="Comentario">Comentario</option>
        <option value="Reseña">Reseña</option>
        <option value="Pregunta">Pregunta</option>
        <option value="Otro">Otro</option>
      </select>
    </div>
    <div class="form-field">
      <label>Mensaje</label>
      <textarea name="message" id="cf-message" required></textarea>
    </div>

    <button type="submit" class="form-submit" id="cfSubmit">Enviar mensaje</button>
    <div class="form-status" id="cfStatus" hidden></div>
  </form>
</section>
</main>
<footer>© 2026 Arruda Van der Ley</footer>
<script>
const nav=document.getElementById('nav'),fill=document.getElementById('threadFill');
window.addEventListener('scroll',()=>{
  const st=scrollY,dh=document.documentElement.scrollHeight-innerHeight;
  fill.style.height=(dh>0?st/dh*100:0)+'%';
  if(st>120) nav.classList.add('scrolled'); else nav.classList.remove('scrolled');
},{passive:true});

const translations={
  es:{'success':'Gracias por escribir. Tu mensaje ha llegado — te responderé en cuanto pueda.','error':'Algo no salió bien. Intenta de nuevo en un momento.','sending':'Enviando...','send':'Enviar mensaje'},
  en:{'success':"Thank you for writing. Your message has arrived — I'll reply as soon as I can.",'error':'Something went wrong. Please try again.','sending':'Sending...','send':'Send message'},
  pt:{'success':'Obrigado por escrever. Sua mensagem chegou — responderei assim que possível.','error':'Algo deu errado. Tente novamente.','sending':'Enviando...','send':'Enviar mensagem'}
};

const form=document.getElementById('contactForm');
const statusEl=document.getElementById('cfStatus');
const btn=document.getElementById('cfSubmit');

function getLang(){return document.documentElement.lang||'es';}

// Mostrar mensaje si viene con ?enviado=1 (por si usas _next en el futuro)
if(location.search.includes('enviado=1')){
  const l=getLang();
  statusEl.textContent=(translations[l]||translations.es).success;
  statusEl.className='form-status success';
  statusEl.hidden=false;
  history.replaceState({},'',location.pathname);
}

// ENVIO AJAX SIN REDIRECCION - SOLUCION AL PROBLEMA DE QUE TE MANDA A LA HOME
form.addEventListener('submit', async (e)=>{
  e.preventDefault(); // <- Esto evita que te redirija a arrudavanderley.com/
  const l=getLang();
  const t=translations[l]||translations.es;
  statusEl.hidden=true;
  btn.disabled=true;
  btn.textContent=t.sending;

  try{
    const formData=new FormData(form);
    // IMPORTANTE: usar endpoint /ajax/el/kilubi y NO incluir _next
    const res=await fetch('https://formsubmit.co/ajax/el/kilubi',{
      method:'POST',
      body:formData,
      headers:{'Accept':'application/json'}
    });
    
    const data=await res.json().catch(()=>({}));
    console.log('FormSubmit response:', res.status, data);

    if(res.ok){
      statusEl.textContent=t.success;
      statusEl.className='form-status success';
      statusEl.hidden=false;
      form.reset();
    } else {
      // Si el alias no permite ajax, FormSubmit devuelve error 400
      // En ese caso intentamos con el endpoint directo de email como fallback
      // Cambia abajo TU_EMAIL por tu email real si quieres probar el fallback
      throw new Error(data.message || ('Error '+res.status));
    }
  } catch(err){
    console.error(err);
    const l=getLang();
    const t=translations[l]||translations.es;
    statusEl.textContent=t.error+"\n("+err.message+")\n\nRevisa la consola (F12) y dime que aparece.";
    statusEl.className='form-status error';
    statusEl.hidden=false;
  } finally {
    const l=getLang();
    btn.disabled=false;
    btn.textContent=(translations[l]||translations.es).send;
  }
});

document.querySelectorAll('.lang-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.lang-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.documentElement.lang=b.dataset.lang;
    try{localStorage.setItem('gael-lang',b.dataset.lang)}catch(e){}
  });
});
try{
  const saved=localStorage.getItem('gael-lang');
  if(saved){ document.documentElement.lang=saved; document.querySelectorAll('.lang-btn').forEach(x=>x.classList.toggle('active',x.dataset.lang===saved));}
}catch(e){}
</script>
</body>
</html>
